<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <title>inkwell editor</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body class="view-list tab-write">
    <!-- 网络操作期间的不确定进度条：GitHub 接口给不出真实百分比，不假装 -->
    <div class="progress" id="progress" role="progressbar" aria-hidden="true"><i></i></div>

    <header class="topbar">
      <div class="brand">inkwell editor</div>
      <div class="conn" id="conn">未连接</div>
      <div class="spacer"></div>
      <button class="icon-btn" id="btnRefresh" title="刷新">↻</button>
      <button class="icon-btn" id="btnSettings" title="设置">⚙</button>
    </header>

    <div class="main">
      <aside class="side">
        <div class="side-head">
          <input class="search" id="search" placeholder="搜索标题…" />
          <button class="new-btn" id="btnNew">＋ 新篇</button>
        </div>
        <div class="items" id="items">
          <div class="empty">还没有连接仓库</div>
        </div>
      </aside>

      <section class="editor">
        <div class="meta">
          <input class="title-input" id="title" placeholder="标题" />
          <div class="meta-row">
            <input class="chip-input date" id="date" type="datetime-local" step="1" />
            <input class="chip-input slug" id="slug" placeholder="路径" spellcheck="false" />
          </div>
          <div class="meta-row">
            <input class="chip-input tags" id="tags" placeholder="标签，逗号分隔" />
          </div>
        </div>

        <div class="mobile-tabs" id="tabs">
          <button data-tab="write" class="on">写作</button>
          <button data-tab="preview">预览</button>
        </div>

        <div class="body-wrap">
          <div class="write-pane">
            <div class="toolbar" id="toolbar" role="toolbar" aria-label="格式">
              <button class="tb" data-action="bold" title="粗体 Ctrl+B" aria-label="粗体"><span class="tb-b">B</span></button>
              <button class="tb" data-action="italic" title="斜体 Ctrl+I" aria-label="斜体"><span class="tb-i">I</span></button>
              <button class="tb" data-action="strike" title="删除线 Ctrl+Shift+X" aria-label="删除线"><span class="tb-s">S</span></button>
              <span class="tb-sep"></span>
              <button class="tb" data-action="h2" title="二级标题" aria-label="二级标题"><span class="tb-h">H2</span></button>
              <button class="tb" data-action="h3" title="三级标题" aria-label="三级标题"><span class="tb-h">H3</span></button>
              <button class="tb" data-action="quote" title="引用" aria-label="引用"><span class="tb-q">”</span></button>
              <span class="tb-sep"></span>
              <button class="tb" data-action="ul" title="无序列表" aria-label="无序列表">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.6 4.6h9M6.6 8h9M6.6 11.4h9"/><circle cx="3.1" cy="4.6" r="1.05"/><circle cx="3.1" cy="8" r="1.05"/><circle cx="3.1" cy="11.4" r="1.05"/></svg>
              </button>
              <button class="tb" data-action="ol" title="有序列表" aria-label="有序列表"><span class="tb-num">1.</span></button>
              <span class="tb-sep"></span>
              <button class="tb" data-action="link" title="链接 Ctrl+K" aria-label="链接">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.7 9.3a2.9 2.9 0 0 0 4.1 0l2.3-2.3a2.9 2.9 0 1 0-4.1-4.1L7.9 4.1M9.3 6.7a2.9 2.9 0 0 0-4.1 0L2.9 9a2.9 2.9 0 1 0 4.1 4.1L8.1 11.9"/></svg>
              </button>
              <button class="tb" data-action="code" title="行内代码" aria-label="行内代码">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 4 2.9 8l3.3 4M9.8 4 13.1 8l-3.3 4"/></svg>
              </button>
              <button class="tb" data-action="codeblock" title="代码块" aria-label="代码块">
                <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="3.2" width="11.6" height="9.6" rx="1.6"/><path d="M6.4 6.4 4.8 8l1.6 1.6M9.6 6.4 11.2 8 9.6 9.6"/></svg>
              </button>
              <span class="tb-sep"></span>
              <button class="tb" data-action="table" title="表格" aria-label="表格">
                <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="3.4" width="11.6" height="9.2" rx="1.2"/><path d="M2.2 6.6h11.6M6.3 6.6v6M9.8 6.6v6"/></svg>
              </button>
              <button class="tb" data-action="image" title="图片" aria-label="图片">
                <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="3.4" width="11.6" height="9.2" rx="1.4"/><circle cx="5.8" cy="6.4" r=".95"/><path d="m3 11.6 3.1-3 2.4 2.3 2.2-2 2.1 2.2"/></svg>
              </button>
              <button class="tb" data-action="hr" title="分隔线" aria-label="分隔线">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.4 8h11.2"/></svg>
              </button>
            </div>
            <textarea class="body-input" id="body" placeholder="从这里开始写…" spellcheck="false"></textarea>
          </div>
          <div class="preview" id="preview"><div class="prose" id="prose"></div></div>
        </div>
      </section>
    </div>

    <footer class="bottombar">
      <div class="state" id="state">就绪</div>
      <button class="btn ghost" id="btnBack">列表</button>
      <button class="btn ghost" id="btnDelete" title="删除这篇">删除</button>
      <button class="btn" id="btnSave">存草稿</button>
      <button class="btn primary" id="btnPublish">发布</button>
    </footer>

    <div class="sheet" id="sheet">
      <div class="sheet-inner">
        <h2>连接到仓库</h2>
        <p class="hint">
          内容直接存进 GitHub 仓库，网站由云端自动构建。Token 只存在这台设备的浏览器里，不会上传到别处。
        </p>
        <div class="field">
          <label>仓库（owner/repo）</label>
          <input id="cfgRepo" placeholder="yourname/my-blog" spellcheck="false" />
        </div>
        <div class="field">
          <label>分支</label>
          <input id="cfgBranch" placeholder="main" spellcheck="false" />
        </div>
        <div class="field">
          <label>文章目录</label>
          <input id="cfgDir" placeholder="src/content/blog" spellcheck="false" />
        </div>
        <div class="field">
          <label>GitHub Token（需要 Contents 读写权限）</label>
          <input id="cfgToken" type="password" placeholder="github_pat_…" spellcheck="false" />
        </div>
        <div class="sheet-actions">
          <button class="btn" id="btnCancelCfg">取消</button>
          <button class="btn primary" id="btnSaveCfg">保存并连接</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden />

    <script type="module">
      import {
        POSTS_DIR,
        renderMarkdown,
        excerpt,
        normalizeTags,
        todayISO,
        nowStamp,
        toLocalInput,
        stampLabel,
        slugFor,
        assertSlug,
        buildPostFile,
        parsePostFile,
        createGitHub,
        GitHubError,
        applyFormat,
        continueList,
        insertBlock,
        IMAGES_DIR,
        IMAGE_URL_PREFIX,
        imageName,
        imageMarkdown,
        altFromFilename,
      } from './core.js';

      const CFG_KEY = 'inkwell:cfg';
      const DRAFT_KEY = 'inkwell:draft:';
      const CACHE_KEY = 'inkwell:cache';

      const el = {
        conn: document.getElementById('conn'),
        items: document.getElementById('items'),
        search: document.getElementById('search'),
        title: document.getElementById('title'),
        date: document.getElementById('date'),
        slug: document.getElementById('slug'),
        tags: document.getElementById('tags'),
        body: document.getElementById('body'),
        prose: document.getElementById('prose'),
        preview: document.getElementById('preview'),
        state: document.getElementById('state'),
        sheet: document.getElementById('sheet'),
        cfgRepo: document.getElementById('cfgRepo'),
        cfgBranch: document.getElementById('cfgBranch'),
        cfgDir: document.getElementById('cfgDir'),
        cfgToken: document.getElementById('cfgToken'),
        toast: document.getElementById('toast'),
        progress: document.getElementById('progress'),
        tabs: document.getElementById('tabs'),
        toolbar: document.getElementById('toolbar'),
        btnSave: document.getElementById('btnSave'),
        btnPublish: document.getElementById('btnPublish'),
        btnDelete: document.getElementById('btnDelete'),
        btnBack: document.getElementById('btnBack'),
        btnNew: document.getElementById('btnNew'),
        fileInput: document.getElementById('fileInput'),
      };

      const app = {
        cfg: null,
        gh: null,
        items: [],
        slug: '',
        sha: null,
        dirty: false,
        slugTouched: false,
        loading: false,
        // 本次会话上传过的图：路径 → blob URL，让预览立刻有图，不用等云端构建
        imageBlobs: {},
      };

      /* ---------- 小工具 ---------- */

      let toastTimer = 0;
      function toast(msg) {
        el.toast.textContent = msg;
        el.toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2200);
      }

      function setState(text, warn) {
        el.state.textContent = text;
        el.state.className = warn ? 'state warn' : 'state';
      }

      /* ---------- 忙碌态：进度条 + 按钮文字 ---------- */

      let busyDepth = 0;

      function beginBusy(text) {
        busyDepth++;
        el.progress.classList.add('on');
        el.progress.setAttribute('aria-hidden', 'false');
        if (text) setState(text);
      }

      function endBusy() {
        busyDepth = Math.max(0, busyDepth - 1);
        if (busyDepth > 0) return;
        el.progress.classList.remove('on');
        el.progress.setAttribute('aria-hidden', 'true');
      }

      // 按钮文字换成进行时，结束时还原。原文字存在 dataset 里，不怕多次调用
      function setBtnBusy(btn, busy, text) {
        if (!btn) return;
        if (busy) {
          if (btn.dataset.label == null) btn.dataset.label = btn.textContent;
          btn.textContent = text;
          btn.disabled = true;
        } else {
          if (btn.dataset.label != null) btn.textContent = btn.dataset.label;
          btn.disabled = false;
        }
      }

      function readCfg() {
        try {
          return JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
        } catch {
          return null;
        }
      }

      function writeCache(map) {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify(map));
        } catch {
          /* 超额就放弃缓存，不影响主流程 */
        }
      }

      function readCache() {
        try {
          return JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
        } catch {
          return {};
        }
      }

      function readDraft(slug) {
        try {
          return JSON.parse(localStorage.getItem(DRAFT_KEY + slug) || 'null');
        } catch {
          return null;
        }
      }

      function saveDraft() {
        if (!app.slug) return;
        const data = {
          title: el.title.value,
          date: el.date.value,
          tags: el.tags.value,
          body: el.body.value,
          savedAt: Date.now(),
        };
        localStorage.setItem(DRAFT_KEY + app.slug, JSON.stringify(data));
        app.dirty = true;
        setState(`草稿已存在本机 · ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`, true);
      }

      function clearDraft(slug) {
        localStorage.removeItem(DRAFT_KEY + slug);
      }

      /* ---------- 预览 ---------- */

      // App 里是本地打包（webDir），/images/ 会指向设备本地，图直接裂掉。
      // 网页端在 /app/ 下，/images/ 正好是站点根，本来就对，不需要改。
      const SITE_ORIGIN = 'https://datasickle-blog.pages.dev';

      function previewHtml(src) {
        const html = renderMarkdown(src);
        return html.replace(/src="(\/images\/[^"]+)"/g, (whole, path) => {
          // 本次刚传的图用 blob，预览立刻有图，不必等云端构建完
          if (app.imageBlobs[path]) return `src="${app.imageBlobs[path]}"`;
          if (window.Capacitor) return `src="${SITE_ORIGIN}${path}"`;
          return whole;
        });
      }

      let previewTimer = 0;
      function schedulePreview() {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => {
          el.prose.innerHTML = previewHtml(el.body.value || '（还没写内容）');
        }, 120);
      }

      /* ---------- 连接 ---------- */

      function connect() {
        if (!app.cfg) {
          el.conn.textContent = '未连接';
          el.conn.className = 'conn';
          return false;
        }
        app.gh = createGitHub(app.cfg);
        el.conn.textContent = `${app.cfg.owner}/${app.cfg.repo}`;
        el.conn.className = 'conn ok';
        el.conn.title = `${app.cfg.owner}/${app.cfg.repo} @ ${app.cfg.branch}`;
        return true;
      }

      /* ---------- 文章列表 ---------- */

      function renderList() {
        const q = el.search.value.trim().toLowerCase();
        const list = app.items.filter((it) => {
          if (!q) return true;
          return (it.title || it.slug).toLowerCase().includes(q) || it.slug.includes(q);
        });

        if (!app.cfg) {
          el.items.innerHTML = '<div class="empty">先点右上角 ⚙ 填仓库信息</div>';
          return;
        }
        if (!list.length) {
          el.items.innerHTML = `<div class="empty">${q ? '没有匹配的文章' : '仓库里还没有文章<br />点「＋ 新篇」开始'}</div>`;
          return;
        }

        el.items.innerHTML = list
          .map((it) => {
            const draft = readDraft(it.slug);
            const active = it.slug === app.slug ? ' active' : '';
            const dot = draft ? '<span class="dot"></span>' : '';
            const tags = it.tags && it.tags.length ? `<span>${it.tags[0]}</span>` : '';
            return `<button class="item${active}" data-slug="${it.slug}">
              <span class="t">${escapeHtml(it.title || it.slug)}</span>
              <span class="m">${dot}<span>${stampLabel(it.date)}</span>${tags}</span>
            </button>`;
          })
          .join('');
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      async function refresh() {
        if (!app.gh || app.loading) return;
        app.loading = true;
        beginBusy('正在读取仓库…');
        try {
          const files = await app.gh.listDir(app.cfg.dir);
          const cache = readCache();
          app.items = files
            .map((f) => {
              const hit = cache[f.path];
              return {
                slug: f.slug,
                path: f.path,
                sha: f.sha,
                title: hit && hit.sha === f.sha ? hit.title : '',
                date: hit && hit.sha === f.sha ? hit.date : '',
                tags: hit && hit.sha === f.sha ? hit.tags : [],
              };
            })
            .sort((a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0));

          renderList();

          const stale = app.items.filter((it) => !it.title);
          for (let i = 0; i < stale.length; i += 6) {
            await Promise.all(
              stale.slice(i, i + 6).map(async (it) => {
                try {
                  const file = await app.gh.getFile(it.path);
                  const parsed = parsePostFile(file.text, it.slug);
                  it.title = parsed.title;
                  it.date = parsed.date;
                  it.tags = parsed.tags;
                  cache[it.path] = { sha: it.sha, title: parsed.title, date: parsed.date, tags: parsed.tags };
                } catch {
                  /* 单个失败不影响整体 */
                }
              })
            );
            renderList();
          }
          writeCache(cache);
          app.items.sort((a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0));
          renderList();
          setState(`共 ${app.items.length} 篇`);
        } catch (err) {
          el.conn.className = 'conn bad';
          el.conn.textContent = err.status ? `连接失败 ${err.status}` : '连接失败';
          el.items.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
          setState(err.message, true);
        } finally {
          app.loading = false;
          endBusy();
        }
      }

      /* ---------- 打开 / 新建 ---------- */

      function fillEditor({ title, date, tags, body }) {
        el.title.value = title || '';
        el.date.value = toLocalInput(date || nowStamp());
        el.tags.value = (tags || []).join(', ');
        el.body.value = body || '';
        schedulePreview();
      }

      async function openPost(slug) {
        if (app.dirty && app.slug && app.slug !== slug) saveDraft();
        const meta = app.items.find((it) => it.slug === slug);
        if (!meta || !app.gh) return;

        app.slug = slug;
        app.sha = null;
        app.slugTouched = true;
        el.btnDelete.disabled = true;
        el.slug.value = slug;
        document.body.classList.remove('view-list');
        document.body.classList.add('view-edit');
        setState('读取中…');

        const draft = readDraft(slug);
        try {
          const file = await app.gh.getFile(meta.path);
          app.sha = file.sha;
          el.btnDelete.disabled = false;
          const parsed = parsePostFile(file.text, slug);
          if (draft && draft.savedAt) {
            fillEditor(draft);
            app.dirty = true;
            setState('已载入远程版本，本机有更新的草稿', true);
          } else {
            fillEditor(parsed);
            app.dirty = false;
            setState('已载入');
          }
        } catch (err) {
          if (draft) {
            fillEditor(draft);
            setState('离线：显示本机草稿', true);
          } else {
            setState(err.message, true);
          }
        }
        renderList();
      }

      function newPost(focus = true) {
        if (app.dirty && app.slug) saveDraft();
        app.slug = '';
        app.sha = null;
        app.slugTouched = false;
        el.btnDelete.disabled = true;
        el.slug.value = '';
        el.search.value = '';
        fillEditor({ title: '', date: nowStamp(), tags: [], body: '' });
        app.dirty = false;
        document.body.classList.remove('view-list');
        document.body.classList.add('view-edit');
        setTab('write');
        setState('新篇 · 还没写标题');
        renderList();
        if (focus) el.title.focus();
      }

      function ensureSlug() {
        if (el.slug.value.trim()) {
          app.slug = el.slug.value.trim();
          return app.slug;
        }
        const s = slugFor(el.title.value, el.date.value || nowStamp());
        el.slug.value = s;
        app.slug = s;
        return s;
      }

      /* ---------- 发布 ---------- */

      async function publish() {
        if (!app.gh) {
          openSheet();
          return;
        }
        if (!el.title.value.trim()) {
          toast('先写个标题');
          el.title.focus();
          return;
        }
        if (app.dirty && app.slug) saveDraft();

        let slug;
        try {
          slug = assertSlug(ensureSlug());
        } catch (err) {
          toast(err.message);
          el.slug.focus();
          return;
        }

        const text = buildPostFile({
          title: el.title.value,
          date: el.date.value,
          tags: el.tags.value,
          draft: false,
          body: el.body.value,
          slug,
        });

        const isNew = !app.sha;
        const message = `${isNew ? '新增' : '更新'}《${el.title.value.trim()}》`;

        const path = `${app.cfg.dir}/${slug}.md`;

        setBtnBusy(el.btnPublish, true, '发布中…');
        beginBusy('正在推送…');
        try {
          let result;
          try {
            result = await app.gh.putFile(path, text, message, app.sha || undefined);
          } catch (err) {
            // 本地以为不存在、远程其实已有：取回 sha 再覆盖一次
            if (err.status === 422 && !app.sha) {
              const remote = await app.gh.getFile(path);
              result = await app.gh.putFile(path, text, message, remote.sha);
            } else {
              throw err;
            }
          }
          app.sha = result.sha;
          app.slug = slug;
          app.dirty = false;
          el.btnDelete.disabled = false;
          clearDraft(slug);

          const cache = readCache();
          cache[`${app.cfg.dir}/${slug}.md`] = {
            sha: result.sha,
            title: el.title.value.trim(),
            date: el.date.value,
            tags: normalizeTags(el.tags.value),
          };
          writeCache(cache);

          const at = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
          if (!app.items.some((it) => it.slug === slug)) {
            app.items.unshift({
              slug,
              path: `${app.cfg.dir}/${slug}.md`,
              sha: result.sha,
              title: el.title.value.trim(),
              date: el.date.value,
              tags: normalizeTags(el.tags.value),
            });
          }
          renderList();

          toast('已发布，云端会自动构建');
          newPost(false); // 发布完清空当前页，直接开始下一篇（不弹键盘）
          setState(`已发布 · ${at}`);
        } catch (err) {
          setState('发布失败', true);
          toast(err.message || '发布失败');
          if (err instanceof GitHubError && err.status === 409) {
            toast('远程有更新，正在重新同步…');
            await refresh();
          }
        } finally {
          setBtnBusy(el.btnPublish, false);
          endBusy();
        }
      }

      async function removePost() {
        if (!app.gh || !app.sha || !app.slug) {
          toast('这篇还没发布到仓库');
          return;
        }
        if (!confirm(`确定删除《${el.title.value || app.slug}》？这会同时从仓库删掉。`)) return;
        setBtnBusy(el.btnDelete, true, '删除中…');
        beginBusy('正在删除…');
        try {
          await app.gh.deleteFile(`${app.cfg.dir}/${app.slug}.md`, app.sha, `删除《${el.title.value || app.slug}》`);
          clearDraft(app.slug);
          app.items = app.items.filter((it) => it.slug !== app.slug);
          app.sha = null;
          app.slug = '';
          el.btnDelete.disabled = true;
          renderList();
          document.body.classList.remove('view-edit');
          document.body.classList.add('view-list');
          setState('已删除');
          toast('已从仓库删除');
        } catch (err) {
          setState('删除失败', true);
          toast(err.message || '删除失败');
        } finally {
          setBtnBusy(el.btnDelete, false);
          // 删成功后 app.sha 已清空，按钮要重新禁用；失败则保持可用
          el.btnDelete.disabled = !app.sha;
          endBusy();
        }
      }

      /* ---------- 设置面板 ---------- */

      function openSheet() {
        const cfg = app.cfg || {};
        el.cfgRepo.value = cfg.owner && cfg.repo ? `${cfg.owner}/${cfg.repo}` : '';
        el.cfgBranch.value = cfg.branch || 'main';
        el.cfgDir.value = cfg.dir || POSTS_DIR;
        el.cfgToken.value = cfg.token || '';
        el.sheet.classList.add('open');
        el.cfgRepo.focus();
      }

      function saveCfg() {
        const raw = el.cfgRepo.value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '');
        const parts = raw.split('/').filter(Boolean);
        if (parts.length !== 2) {
          toast('仓库要写成 owner/repo 的形式');
          return;
        }
        const cfg = {
          owner: parts[0],
          repo: parts[1],
          branch: el.cfgBranch.value.trim() || 'main',
          dir: el.cfgDir.value.trim() || POSTS_DIR,
          token: el.cfgToken.value.trim(),
        };
        localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
        app.cfg = cfg;
        el.sheet.classList.remove('open');
        connect();
        refresh();
      }

      /* ---------- 格式工具条 ---------- */

      const ACTION_NAMES = {
        bold: '粗体',
        italic: '斜体',
        strike: '删除线',
        code: '行内代码',
        link: '链接',
        h2: '二级标题',
        h3: '三级标题',
        quote: '引用',
        ul: '无序列表',
        ol: '有序列表',
        codeblock: '代码块',
        table: '表格',
        image: '图片',
        hr: '分隔线',
      };

      // 只替换真正变了的那一段：交给浏览器执行，撤销记录不会被清空
      function diffRange(oldStr, newStr) {
        const min = Math.min(oldStr.length, newStr.length);
        let p = 0;
        while (p < min && oldStr[p] === newStr[p]) p += 1;
        let q = 0;
        while (q < min - p && oldStr[oldStr.length - 1 - q] === newStr[newStr.length - 1 - q]) q += 1;
        return { from: p, to: oldStr.length - q, insert: newStr.slice(p, newStr.length - q) };
      }

      function commitEdit(next, start, end) {
        const ta = el.body;
        const old = ta.value;
        if (next === old) {
          ta.focus();
          ta.setSelectionRange(start, end);
          return;
        }
        ta.focus();
        const d = diffRange(old, next);
        let done = false;
        try {
          ta.setSelectionRange(d.from, d.to);
          done = document.execCommand('insertText', false, d.insert);
        } catch {
          done = false;
        }
        if (!done || ta.value !== next) ta.value = next;
        ta.setSelectionRange(start, end);
        if (app.slug) app.dirty = true;
        setState('有未发布的改动', true);
        schedulePreview();
      }

      function runFormat(action) {
        // 图片不再插占位符，直接开文件选择器：选完压缩、上传、回填真实链接
        if (action === 'image') {
          if (!app.cfg || !app.cfg.token) {
            toast('先点右上角 ⚙ 配置仓库');
            return;
          }
          el.fileInput.click();
          return;
        }
        const focused = document.activeElement === el.body;
        const len = el.body.value.length;
        const start = focused ? el.body.selectionStart : len;
        const end = focused ? el.body.selectionEnd : len;
        const res = applyFormat(el.body.value, start, end, action);
        if (res) commitEdit(res.value, res.start, res.end);
      }

      /* ---------- 插图 ---------- */

      // 压到长边 1600 后通常 200~400KB；还超标就再降一档
      const IMAGE_SOFT_LIMIT = 900 * 1024;

      function extOf(type) {
        if (type === 'image/png') return 'png';
        if (type === 'image/gif') return 'gif';
        if (type === 'image/webp') return 'webp';
        if (type === 'image/avif') return 'avif';
        return 'jpg';
      }

      function loadImage(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => resolve({ img, url });
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('这张图打不开，可能是 HEIC 格式'));
          };
          img.src = url;
        });
      }

      function drawToBlob(img, maxSide, quality) {
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('图片处理失败'))), 'image/jpeg', quality);
        });
      }

      /**
       * 手机原图动辄 4~8MB，直接提交会让仓库迅速变大、上传也慢。
       * GIF 不压（压了丢动画），小 PNG 原样保留（避免透明底被填白），其余统一转 JPEG。
       */
      async function prepareImage(file) {
        const type = String(file.type || '');
        if (type === 'image/gif') {
          if (file.size > 5 * 1024 * 1024) throw new Error('GIF 请控制在 5MB 内');
          return { bytes: new Uint8Array(await file.arrayBuffer()), ext: 'gif' };
        }
        if (type === 'image/png' && file.size <= 300 * 1024) {
          return { bytes: new Uint8Array(await file.arrayBuffer()), ext: 'png' };
        }
        if (file.size <= 150 * 1024) {
          return { bytes: new Uint8Array(await file.arrayBuffer()), ext: extOf(type) };
        }

        const { img, url } = await loadImage(file);
        try {
          let blob = await drawToBlob(img, 1600, 0.82);
          if (blob.size > IMAGE_SOFT_LIMIT) blob = await drawToBlob(img, 1200, 0.72);
          if (blob.size > 5 * 1024 * 1024) throw new Error('压缩后仍然太大，换张图试试');
          return { bytes: new Uint8Array(await blob.arrayBuffer()), ext: 'jpg' };
        } finally {
          URL.revokeObjectURL(url);
        }
      }

      function insertMarkdown(md) {
        const ta = el.body;
        const focused = document.activeElement === ta;
        const pos = focused ? ta.selectionStart : ta.value.length;
        const end = focused ? ta.selectionEnd : ta.value.length;
        const res = insertBlock(ta.value, pos, end, md);
        commitEdit(res.value, res.start, res.end);
      }

      async function insertImages(files) {
        const list = [...files].filter((f) => f && String(f.type).startsWith('image/'));
        if (!list.length) {
          toast('这里只能放图片');
          return;
        }
        if (!app.gh) {
          toast('先点右上角 ⚙ 配置仓库');
          return;
        }

        const total = list.length;
        let done = 0;
        beginBusy(`上传图片 0/${total}`);
        try {
          for (let i = 0; i < total; i += 1) {
            setState(`上传图片 ${i + 1}/${total}…`);
            try {
              const { bytes, ext } = await prepareImage(list[i]);
              const name = imageName(ext, todayISO());
              const repoPath = `${IMAGES_DIR}/${name}`;
              await app.gh.putBinary(repoPath, bytes, `上传图片 ${name}`);

              const url = `${IMAGE_URL_PREFIX}/${name}`;
              // 这个 blob 只在本会话用于预览，真正的图已经在仓库里了
              app.imageBlobs[url] = URL.createObjectURL(list[i]);
              insertMarkdown(imageMarkdown(url, altFromFilename(list[i].name)));
              done += 1;
            } catch (err) {
              toast(`第 ${i + 1} 张失败：${err.message || '上传失败'}`);
            }
          }
          if (done) {
            toast(`已插入 ${done} 张，发布后约 40 秒上线`);
            setState(`已插入 ${done} 张图片`);
          }
        } finally {
          endBusy();
          el.fileInput.value = '';
        }
      }

      /* ---------- 事件 ---------- */

      el.items.addEventListener('click', (e) => {
        const btn = e.target.closest('.item');
        if (btn) openPost(btn.dataset.slug);
      });

      el.search.addEventListener('input', renderList);
      el.btnNew.addEventListener('click', newPost);
      document.getElementById('btnRefresh').addEventListener('click', refresh);
      document.getElementById('btnSettings').addEventListener('click', openSheet);
      document.getElementById('btnSaveCfg').addEventListener('click', saveCfg);
      document.getElementById('btnCancelCfg').addEventListener('click', () => el.sheet.classList.remove('open'));
      el.btnSave.addEventListener('click', () => {
        if (!el.slug.value.trim() && el.title.value.trim()) ensureSlug();
        if (!app.slug) {
          toast('先写标题，或用日期做路径');
          ensureSlug();
        }
        saveDraft();
        toast('草稿已存在本机');
      });
      el.btnPublish.addEventListener('click', publish);
      el.btnDelete.addEventListener('click', removePost);
      el.btnBack.addEventListener('click', () => {
        if (app.dirty && app.slug) saveDraft();
        document.body.classList.remove('view-edit');
        document.body.classList.add('view-list');
        renderList();
      });

      // 按住按钮时不要把焦点从正文夺走，否则选区会丢
      el.toolbar.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button[data-action]')) e.preventDefault();
      });
      el.toolbar.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (btn) runFormat(btn.dataset.action);
      });

      el.body.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
        if (e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
        if (el.body.selectionStart !== el.body.selectionEnd) return;
        const res = continueList(el.body.value, el.body.selectionStart);
        if (!res.handled) return;
        e.preventDefault();
        commitEdit(res.value, res.caret, res.caret);
      });

      el.body.addEventListener('input', () => {
        schedulePreview();
        if (app.slug) app.dirty = true;
        setState('有未发布的改动', true);
      });

      /* ---------- 插图的三个入口：选文件 / 粘贴 / 拖入 ---------- */

      el.fileInput.addEventListener('change', () => {
        if (el.fileInput.files && el.fileInput.files.length) insertImages(el.fileInput.files);
      });

      // 截图后直接 Ctrl+V
      el.body.addEventListener('paste', (e) => {
        const dt = e.clipboardData;
        if (!dt) return;
        const files = [];
        for (const item of dt.items || []) {
          if (item.kind === 'file' && String(item.type).startsWith('image/')) {
            const f = item.getAsFile();
            if (f) files.push(f);
          }
        }
        if (files.length) {
          e.preventDefault();
          insertImages(files);
        }
      });

      el.body.addEventListener('dragover', (e) => {
        if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) {
          e.preventDefault();
          el.body.classList.add('dropping');
        }
      });
      el.body.addEventListener('dragleave', () => el.body.classList.remove('dropping'));
      el.body.addEventListener('drop', (e) => {
        el.body.classList.remove('dropping');
        const files = [...((e.dataTransfer && e.dataTransfer.files) || [])];
        if (files.some((f) => String(f.type).startsWith('image/'))) {
          e.preventDefault();
          insertImages(files);
        }
      });

      el.title.addEventListener('input', () => {
        if (!app.slugTouched) {
          const s = slugFor(el.title.value, el.date.value || nowStamp());
          el.slug.value = el.title.value.trim() ? s : '';
        }
        if (app.slug) app.dirty = true;
        setState('有未发布的改动', true);
      });

      el.slug.addEventListener('input', () => {
        app.slugTouched = true;
        app.slug = el.slug.value.trim();
      });

      el.date.addEventListener('change', () => {
        if (!app.slugTouched) el.slug.value = slugFor(el.title.value, el.date.value);
      });

      function setTab(name) {
        for (const b of el.tabs.querySelectorAll('button')) {
          b.classList.toggle('on', b.dataset.tab === name);
        }
        document.body.classList.toggle('tab-preview', name === 'preview');
        document.body.classList.toggle('tab-write', name === 'write');
      }

      el.tabs.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        setTab(btn.dataset.tab);
      });

      document.addEventListener('keydown', (e) => {
        const mod = e.metaKey || e.ctrlKey;
        if (!mod) return;

        // 只在正文里响应格式快捷键，标题/标签输入框保持系统行为
        if (document.activeElement === el.body) {
          const k = e.key.toLowerCase();
          if (k === 'b' && !e.shiftKey) {
            e.preventDefault();
            return runFormat('bold');
          }
          if (k === 'i' && !e.shiftKey) {
            e.preventDefault();
            return runFormat('italic');
          }
          if (k === 'k' && !e.shiftKey) {
            e.preventDefault();
            return runFormat('link');
          }
          if (k === 'x' && e.shiftKey) {
            e.preventDefault();
            return runFormat('strike');
          }
          if (e.shiftKey && e.code === 'Digit7') {
            e.preventDefault();
            return runFormat('ol');
          }
          if (e.shiftKey && e.code === 'Digit8') {
            e.preventDefault();
            return runFormat('ul');
          }
        }

        if (e.key === 's') {
          e.preventDefault();
          el.btnSave.click();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          publish();
        }
      });

      window.addEventListener('online', () => toast('网络恢复'));
      window.addEventListener('offline', () => setState('离线 · 改动会存在本机', true));

      /* ---------- 启动 ---------- */

      (function boot() {
        el.date.value = toLocalInput(nowStamp());
        schedulePreview();
        app.cfg = readCfg();
        if (!app.cfg || !app.cfg.token) {
          document.body.classList.add('view-list');
          renderList();
          openSheet();
          return;
        }
        connect();
        refresh();
      })();
    </script>
  </body>
</html>
